openapi: 3.1.0
info:
  title: HousePoint API
  version: "1.0.0-alpha"
  description: >
    Verification-first real-estate marketplace API. Source of truth for all
    clients (web, mobile, admin). See docs/09 for conventions and docs/04 for
    the domain model. Phase 0 covers health + auth; property/verification
    endpoints land in Phase 1.
servers:
  - url: http://localhost:8080/v1
    description: Local (docker)
tags:
  - name: system
  - name: auth

paths:
  /health:
    get:
      tags: [system]
      summary: Liveness/readiness probe
      responses:
        "200":
          description: Service healthy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
        "503":
          description: Degraded

  /auth/register:
    post:
      tags: [auth]
      summary: Register a new user (buyer or owner)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResponse" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /auth/login:
    post:
      tags: [auth]
      summary: Log in
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /auth/refresh:
    post:
      tags: [auth]
      summary: Rotate tokens (reuse detection per docs/10)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /auth/logout:
    post:
      tags: [auth]
      summary: Revoke refresh token
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken: { type: string }
      responses:
        "204": { description: No Content }

  /me:
    get:
      tags: [auth]
      summary: Current user profile + roles
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/UserProfile" }
        "401": { $ref: "#/components/responses/Unauthorized" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    Unauthorized:
      description: Unauthenticated
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unprocessable:
      description: Domain/validation error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    Health:
      type: object
      properties:
        status: { type: string, example: ok }
        service: { type: string }
        version: { type: string }
        city: { type: string, example: imphal }
        time: { type: string, format: date-time }
    RegisterRequest:
      type: object
      required: [name, email, password]
      properties:
        name: { type: string }
        email: { type: string, format: email }
        phone: { type: string }
        password: { type: string, minLength: 8 }
        as: { type: string, enum: [buyer, owner], default: buyer }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }
    AuthResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            user: { $ref: "#/components/schemas/UserProfile" }
            accessToken: { type: string }
            expiresIn: { type: integer }
            refreshToken: { type: string }
    UserProfile:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        email: { type: string }
        phone: { type: string, nullable: true }
        status: { type: string }
        roles:
          type: array
          items: { type: string }
        emailVerified: { type: boolean }
        phoneVerified: { type: boolean }
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }
            details:
              type: array
              items:
                type: object
                properties:
                  field: { type: string }
                  issue: { type: string }

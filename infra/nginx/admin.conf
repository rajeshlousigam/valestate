server {
    listen 8082;
    server_name _;
    root /app/admin;
    index index.php;

    charset utf-8;
    client_max_body_size 20M;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass backend:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /app/admin/index.php;
        fastcgi_param DOCUMENT_ROOT /app/admin;
    }

    location ~ /\.(?!well-known) { deny all; }
}

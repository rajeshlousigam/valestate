# Render Blueprint — deploys the ValEstate admin console (and optionally the API).
# Docs: https://render.com/docs/blueprint-spec
#
# NOTE: Render has no managed MySQL. Point DB_* at an external MySQL 8
# (PlanetScale / Aiven / Railway / a Render private MySQL service). Redis is
# optional for the admin (not used by it).

services:
  - type: web
    name: valestate-admin
    runtime: docker
    dockerfilePath: ./infra/render/Dockerfile
    dockerContext: .
    plan: starter
    healthCheckPath: /auth/login
    envVars:
      - key: APP_ROOT
        value: admin
      - key: YII_ENV
        value: prod
      - key: YII_DEBUG
        value: "0"
      - key: COOKIE_VALIDATION_KEY
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ALG
        value: HS256
      - key: DB_HOST
        sync: false        # e.g. mysql-xxxx.aivencloud.com
      - key: DB_PORT
        sync: false        # Aiven uses a non-standard port (e.g. 17007)
      - key: DB_NAME
        sync: false        # Aiven default is "defaultdb"
      - key: DB_USER
        sync: false        # Aiven default is "avnadmin"
      - key: DB_PASSWORD
        sync: false
      - key: DB_SSL
        value: "1"         # Aiven requires TLS
      - key: DB_SSL_VERIFY
        value: "0"         # Aiven uses a private CA; pin via DB_SSL_CA to verify
      - key: DEFAULT_CITY
        value: imphal
      - key: DEFAULT_CURRENCY
        value: INR
      - key: DEFAULT_TIMEZONE
        value: Asia/Kolkata
      # First deploy only: set both to "1" to create schema + seed staff, then
      # set back to "0" and redeploy.
      - key: RUN_MIGRATIONS
        value: "0"
      - key: RUN_SEED
        value: "0"

  # Optional: the REST API (owners/buyers/mobile) from the SAME image.
  # Uncomment to also host it; it needs Redis for health/rate-limit.
  # - type: web
  #   name: valestate-api
  #   runtime: docker
  #   dockerfilePath: ./infra/render/Dockerfile
  #   dockerContext: .
  #   plan: starter
  #   healthCheckPath: /v1/health

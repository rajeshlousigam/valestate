# Render Blueprint — ValEstate demo-data admin console (free tier).
# The REST API service is commented out below; uncomment it to also host the API.
# Docs: https://render.com/docs/blueprint-spec
#
# DB: Render has no managed MySQL — point these at an external MySQL 8 (e.g.
# Aiven free). Enter the DB_* values once (shared env group). Aiven requires TLS
# (DB_SSL=1). Redis is optional and NOT used here (Key Value can be added later).
#
# Free-tier caveats: services sleep after ~15 min idle (cold start on next hit);
# the container filesystem is EPHEMERAL, so uploaded photos/documents don't
# persist across restarts and aren't shared between the two services — fine for
# testing; use S3 for real document storage (docs/05, docs/10).

envVarGroups:
  - name: valestate-db
    envVars:
      - key: DB_HOST
        sync: false        # e.g. mysql-xxxx.aivencloud.com
      - key: DB_PORT
        sync: false        # Aiven uses a non-standard port (e.g. 17007)
      - key: DB_NAME
        sync: false        # Aiven default: defaultdb
      - key: DB_USER
        sync: false        # Aiven default: avnadmin
      - key: DB_PASSWORD
        sync: false
      - key: DB_SSL
        value: "1"
      - key: DB_SSL_VERIFY
        value: "0"

services:
  # ---- Admin / verification console (session app) ----
  - type: web
    name: valestate-admin
    runtime: docker
    dockerfilePath: ./infra/render/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /auth/login
    envVars:
      - fromGroup: valestate-db
      - { key: APP_ROOT, value: admin }
      - { key: YII_ENV, value: prod }
      - { key: YII_DEBUG, value: "0" }
      - { key: DEFAULT_CITY, value: imphal }
      - { key: COOKIE_VALIDATION_KEY, generateValue: true }
      # idempotent — creates schema + seeds roles/localities/staff on each boot
      - { key: RUN_MIGRATIONS, value: "1" }
      - { key: RUN_SEED, value: "1" }
      # demo data (populates the dashboard/queue/lists) — set to "0" for real use
      - { key: RUN_DEMO, value: "1" }

  # ---- REST API (owners/buyers/mobile + web app) — OPTIONAL ----
  # Uncomment this whole block to also host the API (needs the same DB group).
  # - type: web
  #   name: valestate-api
  #   runtime: docker
  #   dockerfilePath: ./infra/render/Dockerfile
  #   dockerContext: .
  #   plan: free
  #   healthCheckPath: /v1/health
  #   envVars:
  #     - fromGroup: valestate-db
  #     - { key: APP_ROOT, value: web }
  #     - { key: YII_ENV, value: prod }
  #     - { key: YII_DEBUG, value: "0" }
  #     - { key: DEFAULT_CITY, value: imphal }
  #     - { key: COOKIE_VALIDATION_KEY, generateValue: true }
  #     - { key: JWT_ALG, value: HS256 }
  #     - { key: JWT_SECRET, generateValue: true }
